# ==============================================================================
# 1. PROJECT METADATA
# ==============================================================================
[project]
name = "xmris"
version = "0.6.1"
description = "An xarray-based MRI and MRS toolbox"
readme = "README.md"
# The 3.13 ceiling is a pyAMARES constraint (the `fitting` extra). It stays
# project-wide only because requires-python cannot be scoped to an optional
# extra; core xmris itself has no such cap. Revisit once pyAMARES supports 3.14.
# Spelled `<3.14`, NOT `<=3.13`: PEP 440 reads `<=3.13` as `<= 3.13.0`, which
# excluded every 3.13 patch release from 3.13.1 on -- i.e. all of them, since
# 3.13.0 shipped in Oct 2024. `<3.14` is what "3.13 is the highest supported
# minor" actually means.
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Andrecho", email = "37243793+andrewendlinger@users.noreply.github.com" }
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["mri", "mrs", "xarray", "spectroscopy", "nmr"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Framework :: Jupyter",
]

dependencies = [
    "anywidget>=0.9.21",
    "matplotlib>=3.5",  # core/accessor + every plot module import it at module level
    "numpy>=1.26.0",
    "pandas>=2.1",      # core/accessor imports pandas directly
    "scipy>=1.11.0",    # core baseline/phasing/bruker import scipy directly
    "xarray<2025.11.0", # Pinned for compatibility
]

[project.optional-dependencies]
# AMARES fitting via `pyamares-xmris` — a BSD repackage of pyAMARES on PyPI (import
# name still `pyAMARES`) that adds the `hlsvdpro` platform marker so it installs on
# Apple Silicon (hlsvdpro ships no arm64 wheel or sdist) plus the numpy<2 / pandas<2.2
# caps pyAMARES needs. Optional so a bare `pip install xmris` stays clean on every
# platform. The caps are restated here so xmris owns them regardless of the provider.
fitting = [
    "pyamares-xmris>=0.3.33",
    "joblib>=1.5.3", # parallel fit dispatch (fitting-only)
    "tqdm>=4.60",    # fitting/amares imports it directly for the fit progress bar
    "numpy<2.0",
    "pandas<2.2",
]

[project.urls]
Repository = "https://github.com/andrewendlinger/xmris"
Documentation = "https://andrewendlinger.github.io/xmris/"

[project.scripts]
docs-api = "xmris._scripts:docs_api"                    # Update API references
docs-notebooks = "xmris._scripts:docs_notebooks"        # Serve tutorials — blocking
docs = "xmris._scripts:docs_all"                        # API refs, then serve site — blocking
test-gen = "xmris._scripts:generate_test_notebooks"
test = "xmris._scripts:run_tests"
lint = "xmris._scripts:run_lint"                        # Format check, then lint — mirrors CI

# ==============================================================================
# 2. BUILD SYSTEM
# ==============================================================================
[build-system]
requires = ["uv_build>=0.10.0,<0.13.0"]
build-backend = "uv_build"

# `pyamares-xmris` resolves from PyPI, so no [tool.uv.sources] redirect is needed.
# For local pyAMARES development, add one pointing at a checkout, e.g.
#   [tool.uv.sources]
#   pyamares-xmris = { path = "../pyAMARES", editable = true }

# ==============================================================================
# 3. DEVELOPMENT DEPENDENCIES
# ==============================================================================
[dependency-groups]
dev = [
    # --- Testing ---
    "pytest>=8.4.0",
    "pytest-cov>=5.0.0,<7.0.0", # Pin <7.0 to fix nbmake subprocess tracking
    "pytest-xdist>=3.8.0",
    "nbmake>=1.5.5",            # Treat notebooks as unit tests
    # --- Documentation ---
    "mystmd>=1.3.0",            # Python MyST CLI for docs building
    "quartodoc>=0.11.1",        # Converts code docstrings to markdown
    "griffe<0.40.0",            # Explicit pin to fix quartodoc parsing bug
    "jupyter-server>=2.17.0",   # Required for rendering docs
    # --- Code Quality ---
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    # --- Interactive/Plotting ---
    "ipympl>=0.10.0",
    "matplotlib>=3.10.0",
    "jupytext>=1.19.1",
    # Pinned <7: ipykernel 7 hangs myst --execute kernels (never signals `idle`,
    # so the docs build stalls until CI's 6h ceiling). See vscode-jupyter#17228.
    # Revisit by removing this pin AND the dependabot ignore together.
    "ipykernel>=6.31.0,<7",
]

# ==============================================================================
# 4. TOOL CONFIGURATIONS
# ==============================================================================

# --- Pytest ---
[tool.pytest.ini_options]
# -n auto: Parallel execution
# --nbmake: Run notebooks as tests
# --cov: Track coverage for 'xmris' only
addopts = """
    -n auto
    --nbmake
    --cov=xmris
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-config=pyproject.toml
"""
testpaths = ["tests"]

# --- Ruff (Linter & Formatter) ---
# Both halves are gated by the `Lint` job in .github/workflows/ci-fast.yml, and
# reproduced locally by `uv run lint`.
[tool.ruff]
line-length = 100

# No target-version: ruff infers it from `requires-python` above, so the two can
# never disagree. They used to -- this said py312 while the package supports 3.10,
# which let the selected `UP` rules propose syntax the `test (3.10)` leg cannot run.

# ruff 0.16 formats Python blocks inside Markdown, and the docs are the one place
# where snippet layout *is* the argument: the leading-dot `.xmr` chains and the
# column-aligned comment gutters are hand-set teaching material, and the formatter
# flattens both onto one line. Those pages are executed as tests by nbmake, so
# their correctness is already gated -- what is left is prose, and prose is ours.
# force-exclude makes the rule hold when a single file is named explicitly too
# (an editor formatting the open buffer), not just when ruff walks the tree.
extend-exclude = ["*.md"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "NPY", "D", "UP"] # Errors, Failures, Isort, NumPy, Docstrings, Upgrade
ignore = ["D100", "D104", "D401"]                  # Ignore missing docstring in public module/package

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# No per-file-ignores. The docs used to carry E501/F401/E402 relief under
# `docs/**/*.py` and `docs/**/*.ipynb`, but jupytext commits only `.md` (now
# excluded above) and the notebooks it generates are gitignored -- which ruff
# skips by default. Both patterns matched nothing, so the relief was fictional.

# --- Jupytext ---
# Tool for automatic two-way syncing between Jupyter Notebooks (.ipynb) and Markdown (.md).
# We edit in .md (git-friendly) or .ipynb (interactive), but only ever commit .md files.
[tool.jupytext]
# To fix missing kernels or sync metadata in bulk, run:
# uv run jupytext --sync --set-kernel python3 --display-name "Python 3 (xmris)" ./docs/**/*.md
formats = "ipynb,md:myst"

# Include display_name to prevent notebook validation errors
notebook_metadata_filter = "-all, kernelspec.name, kernelspec.language, kernelspec.display_name, jupytext.text_representation.extension, jupytext.text_representation.format_name"

# Cell Metadata:
# We strip execution counts and IDs to keep the Markdown clean.
# We keep 'tags' (for MyST directives) and 'name' (for cross-referencing).
cell_metadata_filter = "-all, tags, name"

# --- Mypy (Type Checker) ---
# Not enforced in CI; run locally with `uv run mypy`. Kept lenient because
# xarray / pyamares / anywidget ship incomplete type information.
[tool.mypy]
python_version = "3.11"
files = ["src/xmris"]
ignore_missing_imports = true

# ==============================================================================
# 5. COVERAGE CONFIGURATION
# ==============================================================================
[tool.coverage.run]
source = ["xmris"]
disable_warnings = ["no-data-collected"]
omit = ["*/tests/*", "*/docs/*", "*/_scripts.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
