version: 1
project:
  title: xmris
  description: An xarray-based MRI and MRS toolbox
  github: https://github.com/andrewendlinger/xmris
  references:
    xarray:
      url: https://docs.xarray.dev/en/stable/
  exclude:
    - "**/*.ipynb"
  bibliography:
    - assets/references.bib
    # Frozen metadata for every DOI linked in the docs, regenerated with
    # `myst build --doi-bib`. Without it each build re-resolves those DOIs
    # against doi.org, and under --strict one rate-limited lookup fails the
    # whole build. Declaring `bibliography` at all means only listed files load.
    - myst.doi.bib

  # One directory per chapter, and `folders: true` below turns that directory
  # into the URL prefix -- so the file tree, the sidebar and the address bar all
  # say the same thing.
  #
  # Every chapter is a bare `- title:` group whose FIRST child is its Overview.
  # Not `- file: <chapter>/index.md` + children: book-theme gives a group with a
  # file behind it `onClick: () => setOpen(true)` on the title, so one click both
  # navigates away and force-opens, and the title can never collapse the group
  # again. Without a file the title is a plain div that only toggles -- opening a
  # chapter costs nothing, and the overview is the first entry under it.
  #
  # Numbering lives here in the `title:` strings and nowhere else -- renaming a
  # file's word stem moves its URL, renumbering a TOC title costs nothing.
  toc:
    - file: index.md

    # 1. Hands-on, in the order the four ideas build on each other.
    - title: Basics
      children:
        - file: basics/index.md
          title: Overview
        - file: basics/complex_numbers.md
          title: 1. Complex numbers
        - file: basics/fft.md
          title: 2. FFT basics
        - file: basics/fid_transformations.md
          title: 3. FID & spectrum
        - file: basics/hz_and_ppm.md
          title: 4. Hz and ppm

    # 2. The explainers -- why the library is shaped the way it is.
    - title: Concepts
      children:
        - file: concepts/index.md
          title: Overview
        - file: concepts/architecture.md
          title: 1. The xmris architecture
        - file: concepts/vocabulary.md
          title: 2. The controlled vocabulary
        - file: concepts/domains.md
          title: 3. The two domains

    # 3. A chronological processing pipeline.
    - title: Processing pipeline
      children:
        - file: pipeline/index.md
          title: Overview
        - file: pipeline/zero_fill.md
          title: 1. Zero filling
        - file: pipeline/apodization.md
          title: 2. Apodization
        - file: pipeline/phase.md
          title: 3a. Phase correction
        - file: pipeline/autophasing.md
          title: 3b. Automated phase correction
        - file: pipeline/domain_agnostic_autophase.md
          title: 3c. Domain-agnostic autophase
        - file: pipeline/baseline.md
          title: 4. Baseline correction
        - file: pipeline/domain_contracts.md
          title: 5. Domain contracts in action

    # 4. Quantification -- and the simulator every page in these docs runs on.
    - title: Fitting & simulation
      children:
        - file: fitting/index.md
          title: Overview
        - file: fitting/quickstart.md
          title: "1. Quick start: fitting"
        - file: fitting/simufid.md
          title: 2. FID simulation
        - file: fitting/pyamares.md
          title: 3. AMARES in depth
        - file: fitting/plotting_1dfid.md
          title: 4. Visualizing dynamic fits

    # 5. Static config-based plots and interactive widgets, one level deep.
    - title: Visualization
      children:
        - file: visualization/index.md
          title: Overview
        - file: visualization/plot_basics.md
          title: 1. Config-based plotting
        - file: visualization/plot_waterfall.md
          title: 2. Waterfall plots
        - file: visualization/plot_carpet.md
          title: 3. Carpet plots
        - file: visualization/widget_phase.md
          title: 4. Interactive phasing
        - file: visualization/widget_scroller.md
          title: 5. Interactive scrolling
        - file: visualization/apodization.md
          title: 6. Interactive apodization

    # 6. Getting scanner data in. bruker_fid_loader is contributor-facing prose
    # still marked work-in-progress, so it is hidden rather than dropped -- a
    # page outside the TOC is not built at all, and its inbound links would
    # silently degrade into raw .md downloads.
    - title: Vendor formats
      children:
        - file: vendor/index.md
          title: Overview
        - file: vendor/bruker_filter_removal.md
          title: 1. Bruker — group delay
        - file: vendor/bruker_fid_loader.md
          title: Bruker — FID loading
          hidden: true

    # 7. Generated by `uv run docs-api`. The landing page already groups these
    # by section, so the sidebar lists them flat -- hand-maintained sub-groups
    # here drifted from quartodoc.yml's sections and could not be given landing
    # pages of their own.
    - title: API reference
      children:
        - file: api/index.md
          title: Overview
        - file: api/processing.fourier.md
          title: Fourier transforms
        - file: api/processing.fid.md
          title: FID processing
        - file: api/processing.phasing.md
          title: Phase correction
        - file: api/processing.referencing.md
          title: Axis referencing (Hz ↔ ppm)
        - file: api/visualization.plot.plot_waterfall.md
          title: Waterfall plot
        - file: api/WaterfallConfig.md
          title: Waterfall config
        - file: api/visualization.plot.plot_carpet.md
          title: Carpet plot
        - file: api/CarpetConfig.md
          title: Carpet config
        - file: api/visualization.plot.plot_trajectory.md
          title: Trajectory plot
        - file: api/PlotTrajectoryConfig.md
          title: Trajectory config
        - file: api/visualization.plot.plot_qc_grid.md
          title: QC grid plot
        - file: api/PlotQCGridConfig.md
          title: QC grid config
        - file: api/fitting.simulation.md
          title: FID simulation
        - file: api/fitting.prior_knowledge.md
          title: Prior knowledge
        - file: api/fitting.amares.md
          title: AMARES fitting
        - file: api/vendor.bruker.md
          title: Bruker formats
        - file: api/core.accessor.md
          title: Xarray accessors
        - file: api/core.config.md
          title: Global config
        - file: api/core.options.md
          title: Runtime options
        - file: api/core.utils.md
          title: Utilities
        - file: api/core.validation.md
          title: Validation

    # 8. Contribute -- the router page, then the four steps of a contribution.
    # Step 3 nests, because it is the only one that is a choose-one rather than
    # a do-this: five sibling workflows, each mirroring the Claude Code skill
    # that automates it.
    - title: Contribute
      children:
        - file: contribute/index.md
          title: Overview
        - file: contribute/setup.md
          title: 1. Environment setup
        - file: contribute/contract.md
          title: 2. The Architecture Contract
        - title: 3. Workflow & skills
          children:
            - file: contribute/methods.md
              title: Add a processing method
            - file: contribute/static_widgets.md
              title: Add a widget
            - file: contribute/docs_pages.md
              title: Write a docs page
            - file: contribute/dev_diary.md
              title: Write a dev-diary entry
            - file: contribute/changelog_entries.md
              title: Write a changelog entry
        - file: contribute/pull_requests.md
          title: 4. Open a pull request
        - file: contribute/publishing.md
          title: 5. Publishing

    # 9. Dev diary -- intro pinned first, dated entries chronological below it.
    - title: Dev diary
      children:
        - file: diary/index.md
          title: Overview
        - file: diary/2026-07-22-authoring-skills.md
          title: The authoring skills
        - file: diary/2026-07-23-architecture-contract.md
          title: The Architecture Contract
        - file: diary/2026-07-24-amares-fitting.md
          title: AMARES fitting
        - file: diary/2026-07-25-docs-previews.md
          title: Per-PR docs previews

    # 10. Roadmap -- last, and a plain article rather than a dropdown, so it
    # anchors the end of the sidebar instead of being buried between chapters.
    # Its decision notebooks are niche and reachable from the decision board on
    # the page itself, so they stay in the TOC (hidden entries are still built
    # and still resolve as link targets) but out of the sidebar.
    #
    # The changelog hides here for the same reason, and pairs: the roadmap is
    # what is coming, the changelog what shipped. The sidebar is for what you
    # browse, and nobody browses a changelog -- you arrive at it from the
    # header's Project menu, from a link in the page you were already reading,
    # or from PyPI. That makes the `nav` entry below load-bearing, not a
    # convenience: it is the only navigational route to this page.
    - file: roadmap.md
      title: Roadmap
      children:
        - file: decisions/decision_02_attrs_lineage.md
          title: 02 · Attrs — exploration
          hidden: true
        - file: decisions/decision_02b_physics_constants.md
          title: 02b · Constants — exploration
          hidden: true
        - file: changelog.md
          title: Changelog
          hidden: true

site:
  template: book-theme
  title: xmris
  options:
    logo: assets/logo.svg
    logo_dark: assets/logo_dark.svg
    favicon: assets/favicon.ico
    style: assets/custom.css
    # URLs mirror the folder tree. Without this every page gets a flat root slug
    # assigned in TOC order, with `-1` suffixes on collision -- so two pages
    # named index.md silently become /index and /index-1, and inserting a third
    # renumbers everything below it.
    folders: true

  # The header is a shortcut layer, not the navigation: its dropdowns are hidden
  # below 1024px and the action buttons collapse below 640px, where the sidebar
  # is all a reader has. The logo already links home, so Home is not repeated.
  nav:
    - title: Learn
      children:
        - title: Basics
          url: /basics
        - title: Concepts
          url: /concepts
        - title: Processing pipeline
          url: /pipeline
        - title: Fitting & simulation
          url: /fitting
        - title: Visualization
          url: /visualization
        - title: Vendor formats
          url: /vendor
    - title: API reference
      url: /api
    - title: Project
      children:
        - title: Contribute
          url: /contribute
        - title: Dev diary
          url: /diary
        - title: Roadmap
          url: /roadmap
        - title: Changelog
          url: /changelog

  actions:
    - title: GitHub
      url: https://github.com/andrewendlinger/xmris
    - title: PyPI
      url: https://pypi.org/project/xmris/
