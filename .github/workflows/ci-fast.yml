name: Tests

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  docs-check:
    name: Docs style
    runs-on: ubuntu-latest
    # Stdlib-only and whole-tree: seconds, so it gets its own job rather than
    # riding the test matrix. A docs failure then reads as a docs failure.
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Errors gate (exit 1) -- each one renders wrong or dies as a link, and
      # `myst build` is silent about all of them. Warnings exit 0 by design:
      # real drift, too judgment-dependent to block a PR on.
      - name: Check docs style
        run: python3 .claude/skills/docs-page/check_docs.py

  bare-install:
    name: bare install
    runs-on: ubuntu-latest
    # Every other job installs with `uv sync --all-extras --dev`, so the dependency
    # set a real user receives is exercised nowhere -- which is how #122 shipped a
    # release whose `import xmris` raised ModuleNotFoundError while CI stayed green.
    # One Python version is enough: this checks the dependency *set*, not the matrix.
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python
        run: uv python install 3.13

      # Deliberately no --all-extras and no --dev: installing *only*
      # [project].dependencies into a clean venv is the entire point of the job.
      - name: Install the way a user does
        run: |
          uv venv /tmp/bare --python 3.13
          uv pip install --python /tmp/bare/bin/python .

      - name: Import xmris and run the processing chain
        run: /tmp/bare/bin/python .github/scripts/bare_install_smoke.py

  test:
    runs-on: ubuntu-latest
    # A healthy run is ~4 min; bound it so a hung kernel fails fast, not at GitHub's 6h ceiling.
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run Tests
        run: uv run test

      - name: Upload coverage reports to Codecov
        # Dependabot PRs and forks don't receive repo secrets, so CODECOV_TOKEN
        # is empty and the tokenless upload hard-fails ("Token required because
        # branch is protected"). Skip the upload in those contexts; keep it
        # strict (fail_ci_if_error) on normal PRs.
        if: ${{ github.actor != 'dependabot[bot]' && !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
          # Fetch the uploader from PyPI, not cli.codecov.io. `test` is a required
          # check, so the binary path's GPG step -- which once hung 4.5 min on a
          # keyserver fetch and then failed -- could block every merge in the repo
          # over an outage in a service the PR never touched. PyPI is already a hard
          # dependency of this job via `uv sync`. Deliberately not `skip_validation`:
          # that disables the integrity check rather than moving it. See #115.
          use_pypi: true